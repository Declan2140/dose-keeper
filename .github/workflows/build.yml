name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test scheduling engine
        run: ./gradlew :core:test --stacktrace

      - name: Build test APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: dose-keeper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Release build: shrunk with R8, and signed with the upload key when the secrets are set.
      - name: Decode upload key
        env:
          DK_KEYSTORE_BASE64: ${{ secrets.DK_KEYSTORE_BASE64 }}
        if: env.DK_KEYSTORE_BASE64 != ''
        run: |
          echo "$DK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "DK_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          DK_KEYSTORE_PASSWORD: ${{ secrets.DK_KEYSTORE_PASSWORD }}
          DK_KEY_ALIAS: ${{ secrets.DK_KEY_ALIAS }}
          DK_KEY_PASSWORD: ${{ secrets.DK_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload release bundle
        if: env.DK_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: dose-keeper-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports
